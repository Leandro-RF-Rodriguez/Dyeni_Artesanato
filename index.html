<!doctype html>
<html lang="pt-BR">
<head>
  <!-- ============================================================
       METADADOS DA PÁGINA
       Título, descrição e fontes usadas em todo o site.
  ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dyeni Artesanato — Crochê feito à mão</title>
  <meta name="description" content="Peças de crochê artesanal sob encomenda — decoração, amigurumis, linha infantil e presentes." />

  <!-- Fontes do Google Fonts: Fraunces (títulos) + Work Sans (textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Icone.jpg"/>
  <!-- Folha de estilos separada -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============================================================
       CONTAINER PRINCIPAL
       Todo o conteúdo do site é injetado aqui dentro pelo script.js.
       O site funciona como uma "SPA" (single page app): não existem
       outras páginas .html — a navegação troca o conteúdo deste
       elemento via JavaScript (ver função render() em script.js).
  ============================================================ -->
  <div id="app"></div>

  <!-- Script principal: dados, componentes e lógica de navegação -->
  <script src="script.js"></script>
</body>
</html>
